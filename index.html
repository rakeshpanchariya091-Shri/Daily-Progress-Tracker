<div class="app">
  <h1>📈 My Daily Progress</h1>

  <p>Track yourself. Improve yourself.</p>

  <hr>

  <h2>🏆 Today's Win</h2>
  <textarea id="win" placeholder="Aaj maine kya achieve kiya?"></textarea>

  <h2>❌ Today's Mistake</h2>
  <textarea id="mistake" placeholder="Aaj meri kya mistake/loss raha?"></textarea>

  <button onclick="saveProgress()">Save Today's Progress</button>

  <h2>📊 My Progress</h2>
  <div id="result">
    Abhi koi progress recorded nahi hai.
  </div>
